<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>请前往电脑端审批 - 万华化学</title>
  <script src="https://lf-scm-cn.feishucdn.com/lark/op/h5-js-sdk-1.5.30.js"></script>
  <style>
    :root {
      /* 万华品牌色系（提取自 App Logo：青绿 -> 科技蓝 + 暖金点缀） */
      --brand-teal: #00B8A9;
      --brand-blue: #1456D8;
      --brand-navy: #0B2A66;
      --brand-gold: #C8A252;
      --brand-gradient: linear-gradient(135deg, #00B8A9 0%, #1456D8 100%);

      --bg-page: #F3F6FA;
      --bg-card: #FFFFFF;
      --bg-subtle: #F7F9FC;
      --border-soft: rgba(15, 42, 102, 0.08);

      --text-primary: #141E33;
      --text-secondary: #53627C;
      --text-muted: #8694AB;

      --radius-card: 20px;
      --radius-inner: 12px;
      --shadow-card: 0 12px 36px rgba(15, 42, 102, 0.08), 0 2px 8px rgba(15, 42, 102, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      color: var(--text-primary);
      background-color: var(--bg-page);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      position: relative;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 12% 8%, rgba(0, 184, 169, 0.12) 0%, transparent 42%),
        radial-gradient(circle at 90% 14%, rgba(20, 86, 216, 0.11) 0%, transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(20, 86, 216, 0.05) 0%, transparent 50%);
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      width: 100%;
      background: var(--bg-card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-soft);
      overflow: hidden;
      position: relative;
    }

    /* 顶部品牌渐变装饰条 */
    .card::before {
      content: "";
      display: block;
      width: 100%;
      height: 4px;
      background: var(--brand-gradient);
    }

    .card-body {
      padding: 32px 24px 26px;
      text-align: center;
    }

    /* Logo 展示区 */
    .brand-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 22px;
    }

    .logo-wrap {
      position: relative;
      width: 84px;
      height: 84px;
      border-radius: 22px;
      background: #FFFFFF;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(20, 86, 216, 0.14), 0 0 0 1px rgba(20, 86, 216, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
      display: block;
    }

    /* 右下角 PC 端角标 */
    .pc-badge-icon {
      position: absolute;
      right: -6px;
      bottom: -6px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--brand-gradient);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid #FFFFFF;
      box-shadow: 0 3px 10px rgba(20, 86, 216, 0.28);
    }

    .status-pill {
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      color: var(--brand-blue);
      background: rgba(20, 86, 216, 0.07);
      border: 1px solid rgba(20, 86, 216, 0.12);
      letter-spacing: 0.2px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand-teal);
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-primary);
      margin-bottom: 10px;
      letter-spacing: -0.2px;
    }

    .desc {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text-secondary);
      max-width: 310px;
      margin: 0 auto 22px;
    }

    /* 可选：通过 URL 参数传入的待办信息卡片 */
    .meta-box {
      display: none;
      text-align: left;
      background: var(--bg-subtle);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-inner);
      padding: 12px 14px;
      margin-bottom: 18px;
    }

    .meta-box.visible {
      display: block;
    }

    .meta-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .meta-row + .meta-row {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(15, 42, 102, 0.08);
    }

    .meta-label {
      color: var(--text-muted);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .meta-value {
      color: var(--text-primary);
      font-weight: 500;
      text-align: right;
      word-break: break-all;
    }

    .copy-inline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 6px;
      padding: 1px 7px;
      font-size: 11px;
      color: var(--brand-blue);
      background: rgba(20, 86, 216, 0.08);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      vertical-align: middle;
    }

    .copy-inline:active {
      opacity: 0.7;
    }

    /* 办理指引区 */
    .guide-box {
      text-align: left;
      background: var(--bg-subtle);
      border-radius: var(--radius-inner);
      padding: 14px 16px;
      border: 1px solid var(--border-soft);
    }

    .guide-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-secondary);
    }

    .step-num {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: rgba(20, 86, 216, 0.1);
      color: var(--brand-blue);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .step-item strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* 操作按钮 */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.12s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active {
      transform: scale(0.985);
      opacity: 0.9;
    }

    .btn-primary {
      background: var(--brand-gradient);
      color: #FFFFFF;
      box-shadow: 0 6px 16px rgba(20, 86, 216, 0.24);
    }

    .btn-secondary {
      background: #FFFFFF;
      color: var(--brand-blue);
      border: 1px solid rgba(20, 86, 216, 0.24);
    }

    .footer {
      margin-top: 18px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.88;
    }

    .footer-sep {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--brand-gold);
    }

    /* 轻量 Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(32px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(16px);
      background: rgba(20, 30, 51, 0.92);
      color: #FFFFFF;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      var toastTimer = null;
      var toastEl = document.getElementById("toast");

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove("show");
        }, 2200);
      }

      function copyText(text, successMsg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function () { showToast(successMsg); },
            function () { fallbackCopy(text, successMsg); }
          );
        } else {
          fallbackCopy(text, successMsg);
        }
      }

      function fallbackCopy(text, successMsg) {
        var input = document.createElement("textarea");
        input.value = text;
        input.setAttribute("readonly", "");
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.appendChild(input);
        input.select();
        try {
          document.execCommand("copy");
          showToast(successMsg);
        } catch (e) {
          showToast("复制失败，请手动复制");
        }
        document.body.removeChild(input);
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // 支持通过 URL Query 透传动态信息（均可选）：
      // 例：?title=OA新闻审批&system=OA系统&id=202609290000000012
      var params = new URLSearchParams(window.location.search);
      var title = params.get("title");
      var system = params.get("system");
      var docId = params.get("id");

      var rows = [];
      if (title) {
        rows.push(
          '<div class="meta-row"><span class="meta-label">审批标题</span><span class="meta-value">' +
            escapeHtml(title) +
          "</span></div>"
        );
      }
      if (system) {
        rows.push(
          '<div class="meta-row"><span class="meta-label">来源系统</span><span class="meta-value">' +
            escapeHtml(system) +
          "</span></div>"
        );
      }
      if (docId) {
        rows.push(
          '<div class="meta-row"><span class="meta-label">单据编号</span><span class="meta-value">' +
            escapeHtml(docId) +
            '<button type="button" class="copy-inline" id="copyIdBtn">复制</button>' +
          "</span></div>"
        );
      }

      if (rows.length > 0) {
        var metaBox = document.getElementById("metaBox");
        metaBox.innerHTML = rows.join("");
        metaBox.classList.add("visible");
        var copyIdBtn = document.getElementById("copyIdBtn");
        if (copyIdBtn) {
          copyIdBtn.addEventListener("click", function () {
            copyText(docId, "已复制单据编号");
          });
        }
      }

      var h5Ready = false;
      if (window.h5sdk && typeof window.h5sdk.ready === "function") {
        window.h5sdk.ready(function () {
          h5Ready = true;
        });
      }

      function callTtCloseWindow() {
        if (!window.tt || typeof window.tt.closeWindow !== "function") {
          showToast("当前环境无 tt.closeWindow（非飞书端或 SDK 未加载）");
          return;
        }
        window.tt.closeWindow({
          fail: function (res) {
            showToast("tt.closeWindow 失败：" + (res && res.errMsg ? res.errMsg : JSON.stringify(res)));
          }
        });
      }

      document.getElementById("ttCloseBtn").addEventListener("click", function () {
        if (h5Ready) {
          callTtCloseWindow();
        } else if (window.h5sdk && typeof window.h5sdk.ready === "function") {
          window.h5sdk.ready(function () {
            h5Ready = true;
            callTtCloseWindow();
          });
        } else {
          callTtCloseWindow();
        }
      });

      document.getElementById("winCloseBtn").addEventListener("click", function () {
        window.close();
        setTimeout(function () {
          showToast("window.close() 未生效（页面未关闭）");
        }, 300);
      });
    })();
  </script>
</body>
</html>
